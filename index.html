<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班费记录</title>
    <script>
        (() => {
            const savedTheme = localStorage.getItem('class_fee_theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.dataset.theme = savedTheme || (prefersDark ? 'dark' : 'light');
        })();
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #eef1f6;
            --surface: #f3f5f9;
            --surface-light: #ffffff;
            --text: #20242c;
            --muted: #7b8494;
            --line: #dfe4ec;
            --accent: #4774f5;
            --income: #1f9d72;
            --expense: #e05c62;
            --shadow-raised: 10px 10px 24px rgba(174, 184, 201, .48), -10px -10px 24px rgba(255, 255, 255, .9);
            --shadow-soft: 5px 5px 12px rgba(174, 184, 201, .36), -5px -5px 12px rgba(255, 255, 255, .82);
            --shadow-inset: inset 3px 3px 7px rgba(174, 184, 201, .34), inset -3px -3px 7px rgba(255, 255, 255, .86);
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #171519;
            --surface: #232126;
            --surface-light: #2a272d;
            --text: #f1ecef;
            --muted: #aaa1a8;
            --line: #3b363d;
            --accent: #d6a0b5;
            --income: #9bc7b5;
            --expense: #e2a0ac;
            --shadow-raised: 12px 12px 28px rgba(5, 4, 6, .5), -7px -7px 20px rgba(73, 65, 73, .17);
            --shadow-soft: 6px 6px 14px rgba(5, 4, 6, .42), -5px -5px 13px rgba(75, 68, 75, .14);
            --shadow-inset: inset 3px 3px 8px rgba(4, 3, 5, .5), inset -3px -3px 8px rgba(76, 68, 76, .14);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            color: var(--text);
            background: var(--bg);
            min-height: 100vh;
            padding: 28px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--surface);
            border: 1px solid rgba(255,255,255,.72);
            border-radius: 28px;
            box-shadow: var(--shadow-raised);
            overflow: hidden;
        }

        header {
            background: transparent;
            color: var(--text);
            padding: 42px 36px 26px;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        header h1 { font-size: 2.2em; font-weight: 750; letter-spacing: -.04em; }

        .header-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

        .admin-toggle,
        .theme-toggle {
            background: var(--surface);
            border: 1px solid rgba(255,255,255,.75);
            color: var(--muted);
            padding: 10px 16px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 0.9em;
            box-shadow: var(--shadow-soft);
            transition: transform .2s, box-shadow .2s;
        }

        .theme-toggle {
            width: 42px;
            height: 42px;
            padding: 0;
            display: grid;
            place-items: center;
            font-size: 1.1em;
        }

        .admin-toggle:hover,
        .theme-toggle:hover { transform: translateY(-1px); color: var(--accent); }
        .admin-toggle:active,
        .theme-toggle:active { transform: translateY(0); box-shadow: var(--shadow-inset); }

        :root[data-theme="dark"] body { background: radial-gradient(circle at 50% 0, #29242a 0, var(--bg) 42%); }
        :root[data-theme="dark"] .container,
        :root[data-theme="dark"] .summary-card,
        :root[data-theme="dark"] .admin-toggle,
        :root[data-theme="dark"] .theme-toggle,
        :root[data-theme="dark"] .filter-btn,
        :root[data-theme="dark"] .token-section,
        :root[data-theme="dark"] .form-section,
        :root[data-theme="dark"] tbody tr { border-color: rgba(255, 222, 234, .055); }
        :root[data-theme="dark"] thead { background: rgba(255, 230, 240, .035); }
        :root[data-theme="dark"] tbody tr:hover { background: rgba(255, 222, 234, .035); }
        :root[data-theme="dark"] input,
        :root[data-theme="dark"] select { background: #211f23; color: var(--text); }
        :root[data-theme="dark"] input::placeholder { color: #746d74; }
        :root[data-theme="dark"] .type-income { background: #293d37; color: #a9d5c4; }
        :root[data-theme="dark"] .type-expense { background: #452d34; color: #e9abb7; }
        :root[data-theme="dark"] .btn-edit { background: #34303d; color: #c3b8dc; }
        :root[data-theme="dark"] .btn-delete { background: #452d34; color: #e9abb7; }
        :root[data-theme="dark"] .btn-primary { background: var(--accent); color: #2a2025; }
        :root[data-theme="dark"] .btn-primary:hover { background: #e0afc1; }
        :root[data-theme="dark"] .btn-secondary { background: #343137; color: #d4ccd1; }
        :root[data-theme="dark"] .btn-secondary:hover { background: #3c3840; }
        :root[data-theme="dark"] .token-section p,
        :root[data-theme="dark"] .form-section h3,
        :root[data-theme="dark"] .form-group label,
        :root[data-theme="dark"] .modal h3,
        :root[data-theme="dark"] .loading,
        :root[data-theme="dark"] .no-results { color: var(--muted); }

        /* 汇总卡片 */
        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            padding: 10px 36px 30px;
            background: transparent;
        }

        .summary-card {
            background: var(--surface);
            padding: 24px;
            border: 1px solid rgba(255,255,255,.72);
            border-radius: 20px;
            box-shadow: var(--shadow-soft);
            text-align: left;
            transition: transform .2s ease;
        }

        .summary-card:hover { transform: translateY(-2px); }
        .summary-card h3 { color: var(--muted); font-size: .8em; margin-bottom: 10px; font-weight: 600; }
        .summary-card .amount { font-size: 1.8em; font-weight: 750; color: var(--accent); letter-spacing: -.03em; }
        .summary-card.income .amount { color: var(--income); }
        .summary-card.expense .amount { color: var(--expense); }

        /* 搜索筛选 */
        .controls {
            padding: 8px 36px 24px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
            background: transparent;
        }

        .search-box { flex: 1; min-width: 200px; }

        .search-box input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid rgba(255,255,255,.72);
            border-radius: 16px;
            font-size: 1em;
            color: var(--text);
            background: var(--surface);
            box-shadow: var(--shadow-inset);
            transition: box-shadow .2s;
        }

        .search-box input:focus { outline: none; box-shadow: var(--shadow-inset), 0 0 0 2px rgba(71,116,245,.18); }

        .filter-buttons { display: flex; gap: 10px; flex-wrap: wrap; }

        .filter-btn {
            padding: 12px 20px;
            border: 1px solid rgba(255,255,255,.72);
            background: var(--surface);
            color: #697386;
            border-radius: 14px;
            cursor: pointer;
            font-size: 0.95em;
            box-shadow: var(--shadow-soft);
            transition: all .2s;
        }

        .filter-btn:hover { color: var(--accent); }
        .filter-btn.active { color: var(--accent); box-shadow: var(--shadow-inset); }

        /* 表格 */
        .table-container { padding: 8px 36px 36px; overflow-x: auto; }

        table { width: 100%; border-collapse: separate; border-spacing: 0; }
        thead { background: rgba(255,255,255,.35); }
        th { padding: 16px; text-align: left; font-size: .82em; font-weight: 650; color: var(--muted); border-bottom: 1px solid var(--line); white-space: nowrap; }
        td { padding: 17px 16px; border-bottom: 1px solid var(--line); line-height: 1.55; }
        tbody tr { transition: background-color .2s; }
        tbody tr:hover { background-color: rgba(255,255,255,.42); }

        .type-badge { display: inline-block; padding: 5px 12px; border-radius: 20px; font-size: 0.85em; font-weight: 600; }
        .type-income { background: #dff3eb; color: #187758; }
        .type-expense { background: #f8e4e5; color: #b74349; }
        .amount-positive { color: var(--income); font-weight: 700; white-space: nowrap; }
        .amount-negative { color: var(--expense); font-weight: 700; white-space: nowrap; }

        .action-btn {
            padding: 5px 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85em;
            margin-right: 5px;
            transition: opacity 0.2s;
        }

        .action-btn:hover { opacity: 0.8; }
        .btn-edit { background: #e1e9ff; color: #345ec9; }
        .btn-delete { background: #f8e4e5; color: #b74349; }

        .loading { text-align: center; padding: 60px; color: #666; font-size: 1.2em; }
        .no-results { text-align: center; padding: 40px; color: #999; font-size: 1.1em; }

        footer {
            padding: 20px 30px;
            text-align: center;
            background: transparent;
            color: var(--muted);
            font-size: 0.9em;
        }

        /* 管理面板 */
        .admin-panel {
            display: none;
            background: transparent;
            border-top: 1px solid var(--line);
            padding: 32px 36px;
        }

        .admin-panel.visible { display: block; }

        .admin-panel h2 {
            color: var(--text);
            margin-bottom: 20px;
            font-size: 1.3em;
        }

        .token-section {
            background: var(--surface);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,.72);
            box-shadow: var(--shadow-soft);
        }

        .token-section p {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 10px;
        }

        .token-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .token-row input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid var(--line);
            border-radius: 12px;
            font-size: 0.95em;
            font-family: monospace;
        }

        .token-row input:focus { outline: none; border-color: var(--accent); }

        .token-status {
            font-size: 0.85em;
            margin-top: 8px;
        }

        .token-status.ok { color: #10b981; }
        .token-status.err { color: #ef4444; }

        .form-section {
            background: var(--surface);
            border-radius: 18px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,.72);
            box-shadow: var(--shadow-soft);
        }

        .form-section h3 { color: #333; margin-bottom: 15px; font-size: 1.1em; }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group { display: flex; flex-direction: column; gap: 5px; }

        .form-group label { font-size: 0.85em; color: #555; font-weight: 600; }

        .form-group input,
        .form-group select {
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 12px;
            font-size: 0.95em;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus { outline: none; border-color: var(--accent); }

        .form-actions { display: flex; gap: 10px; flex-wrap: wrap; }

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: #3b66df; }
        .btn-secondary { background: #e3e7ee; color: #3d4654; }
        .btn-secondary:hover { background: #d9dee7; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:hover { background: #dc2626; }
        .btn-success { background: #10b981; color: white; }
        .btn-success:hover { background: #059669; }

        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .save-status {
            margin-top: 12px;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.9em;
            display: none;
        }

        .save-status.saving { display: block; background: #dbeafe; color: #1d4ed8; }
        .save-status.success { display: block; background: #d1fae5; color: #065f46; }
        .save-status.error { display: block; background: #fee2e2; color: #991b1b; }

        /* 模态框（编辑用） */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.visible { display: flex; }

        .modal {
            background: var(--surface);
            border-radius: 22px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            box-shadow: var(--shadow-raised);
        }

        .modal h3 { color: #333; margin-bottom: 20px; font-size: 1.2em; }
        .modal .form-group { margin-bottom: 12px; }
        .modal .form-actions { margin-top: 20px; }

        @media (max-width: 768px) {
            body { padding: 12px; }
            .container { border-radius: 24px; }
            header { padding: 30px 20px 20px; }
            header h1 { font-size: 1.75em; }
            .header-actions { gap: 7px; }
            .admin-toggle { padding: 9px 11px; }
            .theme-toggle { width: 38px; height: 38px; }

            .summary {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 8px;
                padding: 8px 14px 24px;
            }
            .summary-card { padding: 15px 10px; border-radius: 16px; text-align: center; }
            .summary-card h3 { font-size: .7em; margin-bottom: 7px; }
            .summary-card .amount { font-size: clamp(.88em, 4vw, 1.18em); white-space: nowrap; }

            .controls { padding: 4px 14px 22px; gap: 12px; }
            .search-box { flex-basis: 100%; min-width: 0; }
            .filter-buttons { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
            .filter-btn { padding: 10px 8px; }

            .table-container { padding: 0 14px 28px; overflow: visible; }
            #recordTable[style*="table"] { display: block !important; }
            table, tbody { display: block; width: 100%; }
            thead { display: none; }
            tbody { display: grid; gap: 14px; }
            tbody tr {
                display: grid;
                grid-template-columns: auto minmax(0, 1fr) auto;
                align-items: center;
                gap: 9px 10px;
                padding: 17px;
                background: var(--surface);
                border: 1px solid rgba(255,255,255,.76);
                border-radius: 18px;
                box-shadow: var(--shadow-soft);
            }
            tbody tr:hover { background: var(--surface); }
            td { display: block; padding: 0; border: 0; min-width: 0; }
            td:nth-child(1) { grid-column: 1 / 3; grid-row: 2; color: var(--muted); font-size: .82em; }
            td:nth-child(2) { grid-column: 1; grid-row: 1; }
            td:nth-child(3) { grid-column: 2; grid-row: 1; font-size: 1em; font-weight: 650; overflow-wrap: anywhere; }
            td:nth-child(4) { grid-column: 3; grid-row: 1; text-align: right; font-size: 1.02em; }
            td:nth-child(5) { grid-column: 3; grid-row: 2; color: #667083; font-size: .82em; text-align: right; white-space: nowrap; }
            td:nth-child(5)::before { content: '经手：'; color: #a0a7b3; }
            td:nth-child(6) { grid-column: 1 / -1; grid-row: 3; color: var(--muted); font-size: .84em; padding-top: 8px; border-top: 1px solid var(--line); }
            td:nth-child(6)::before { content: '备注：'; color: #a0a7b3; }
            td:nth-child(6):empty { display: none; }
            td:nth-child(7) { grid-column: 1 / -1; grid-row: 4; padding-top: 5px; }
            .type-badge { padding: 5px 9px; font-size: .76em; }

            .admin-panel { padding: 28px 14px; }
            .token-row { flex-wrap: wrap; }
            .token-row input { flex-basis: 100%; min-width: 0; }
            .form-grid { grid-template-columns: 1fr; }
            .modal { width: calc(100% - 24px); max-height: 90vh; overflow-y: auto; padding: 22px; }
            footer { padding: 18px 14px 24px; }
        }

        @media (max-width: 360px) {
            header h1 { font-size: 1.5em; }
            .admin-toggle { font-size: .82em; }
        }

        :root[data-theme="dark"] td:nth-child(5),
        :root[data-theme="dark"] td:nth-child(5)::before,
        :root[data-theme="dark"] td:nth-child(6)::before { color: var(--muted); }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>班费记录</h1>
        <div class="header-actions">
            <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="切换暗色模式" title="切换暗色模式">☾</button>
            <button class="admin-toggle" onclick="toggleAdmin()">班委管理</button>
        </div>
    </header>

    <!-- 汇总 -->
    <div class="summary">
        <div class="summary-card income">
            <h3>总收入</h3>
            <div class="amount" id="totalIncome">¥0.00</div>
        </div>
        <div class="summary-card expense">
            <h3>总支出</h3>
            <div class="amount" id="totalExpense">¥0.00</div>
        </div>
        <div class="summary-card">
            <h3>当前余额</h3>
            <div class="amount" id="balance">¥0.00</div>
        </div>
    </div>

    <!-- 搜索筛选 -->
    <div class="controls">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="搜索事由、经手人...">
        </div>
        <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">全部</button>
            <button class="filter-btn" data-filter="income">收入</button>
            <button class="filter-btn" data-filter="expense">支出</button>
        </div>
    </div>

    <!-- 表格 -->
    <div class="table-container">
        <div id="loading" class="loading">加载中...</div>
        <table id="recordTable" style="display:none;">
            <thead>
                <tr>
                    <th>日期</th>
                    <th>类型</th>
                    <th>事由</th>
                    <th>金额</th>
                    <th>经手人</th>
                    <th>备注</th>
                    <th id="actionHeader" style="display:none;">操作</th>
                </tr>
            </thead>
            <tbody id="recordBody"></tbody>
        </table>
        <div id="noResults" class="no-results" style="display:none;">暂无符合条件的记录</div>
    </div>

    <!-- 管理面板 -->
    <div class="admin-panel" id="adminPanel">
        <h2>班委管理面板</h2>

        <!-- Token 输入 -->
        <div class="token-section">
            <p>输入 GitHub Token（只存在当前浏览器，关闭标签页自动清除，不会上传到 GitHub）</p>
            <div class="token-row">
                <input type="password" id="tokenInput" placeholder="粘贴 GitHub Personal Access Token..." />
                <button class="btn btn-primary" onclick="saveToken()">确认</button>
                <button class="btn btn-secondary" onclick="clearToken()">清除</button>
            </div>
            <div class="token-status" id="tokenStatus"></div>
        </div>

        <!-- 添加记录 -->
        <div class="form-section">
            <h3>添加新记录</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>日期</label>
                    <input type="date" id="newDate" />
                </div>
                <div class="form-group">
                    <label>类型</label>
                    <select id="newType">
                        <option value="income">收入</option>
                        <option value="expense">支出</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>事由</label>
                    <input type="text" id="newReason" placeholder="如：班费收缴" />
                </div>
                <div class="form-group">
                    <label>金额（元）</label>
                    <input type="number" id="newAmount" min="0" step="0.01" placeholder="0.00" />
                </div>
                <div class="form-group">
                    <label>经手人</label>
                    <input type="text" id="newHandler" placeholder="姓名" />
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <input type="text" id="newNote" placeholder="选填" />
                </div>
            </div>
            <div class="form-actions">
                <button class="btn btn-success" onclick="addRecord()">添加并保存</button>
                <button class="btn btn-secondary" onclick="clearForm()">清空</button>
            </div>
            <div class="save-status" id="saveStatus"></div>
        </div>
    </div>

    <footer>
        <p>更新时间: <span id="updateTime"></span></p>
        <p>如有疑问，请联系班委</p>
    </footer>
</div>

<!-- 编辑模态框 -->
<div class="modal-overlay" id="editModal">
    <div class="modal">
        <h3>编辑记录</h3>
        <input type="hidden" id="editIndex" />
        <div class="form-group">
            <label>日期</label>
            <input type="date" id="editDate" />
        </div>
        <div class="form-group">
            <label>类型</label>
            <select id="editType">
                <option value="income">收入</option>
                <option value="expense">支出</option>
            </select>
        </div>
        <div class="form-group">
            <label>事由</label>
            <input type="text" id="editReason" />
        </div>
        <div class="form-group">
            <label>金额（元）</label>
            <input type="number" id="editAmount" min="0" step="0.01" />
        </div>
        <div class="form-group">
            <label>经手人</label>
            <input type="text" id="editHandler" />
        </div>
        <div class="form-group">
            <label>备注</label>
            <input type="text" id="editNote" />
        </div>
        <div class="form-actions">
            <button class="btn btn-primary" onclick="saveEdit()">保存</button>
            <button class="btn btn-secondary" onclick="closeModal()">取消</button>
        </div>
        <div class="save-status" id="editStatus"></div>
    </div>
</div>

<script>
    const OWNER = 'Guaizai-s';
    const REPO  = 'class-fee-disclosure';
    const FILE  = 'data.json';
    const API   = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE}`;

    let records = [];
    let adminVisible = false;

    // ── 明暗主题 ─────────────────────────────────────────────
    function syncThemeButton() {
        const isDark = document.documentElement.dataset.theme === 'dark';
        const button = document.getElementById('themeToggle');
        button.textContent = isDark ? '☀' : '☾';
        button.setAttribute('aria-label', isDark ? '切换亮色模式' : '切换暗色模式');
        button.title = isDark ? '切换亮色模式' : '切换暗色模式';
    }

    function toggleTheme() {
        const nextTheme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        document.documentElement.dataset.theme = nextTheme;
        localStorage.setItem('class_fee_theme', nextTheme);
        syncThemeButton();
    }

    // ── Token 管理 ──────────────────────────────────────────
    function getToken() { return sessionStorage.getItem('gh_token') || ''; }

    function saveToken() {
        const t = document.getElementById('tokenInput').value.trim();
        if (!t) return showTokenStatus('请先粘贴 Token', false);
        sessionStorage.setItem('gh_token', t);
        document.getElementById('tokenInput').value = '';
        showTokenStatus('Token 已保存（关闭标签页后自动清除）', true);
    }

    function clearToken() {
        sessionStorage.removeItem('gh_token');
        document.getElementById('tokenInput').value = '';
        showTokenStatus('已清除', false);
    }

    function showTokenStatus(msg, ok) {
        const el = document.getElementById('tokenStatus');
        el.textContent = msg;
        el.className = 'token-status ' + (ok ? 'ok' : 'err');
    }

    // ── 管理面板切换 ─────────────────────────────────────────
    function toggleAdmin() {
        adminVisible = !adminVisible;
        document.getElementById('adminPanel').classList.toggle('visible', adminVisible);
        document.getElementById('actionHeader').style.display = adminVisible ? '' : 'none';
        if (adminVisible) {
            // 设置默认日期为今天
            const today = new Date().toISOString().slice(0, 10);
            document.getElementById('newDate').value = today;
            if (getToken()) showTokenStatus('Token 已就绪', true);
        }
        renderTable(getFilteredRecords());
    }

    // ── GitHub API：读取文件 SHA ──────────────────────────────
    async function getFileSHA() {
        const res = await fetch(API, {
            headers: { Authorization: `token ${getToken()}`, Accept: 'application/vnd.github+json' }
        });
        if (!res.ok) throw new Error('获取文件信息失败，请检查 Token 是否正确');
        const json = await res.json();
        return json.sha;
    }

    // ── GitHub API：写入文件 ──────────────────────────────────
    async function pushData(newRecords, statusEl) {
        if (!getToken()) {
            showStatus(statusEl, '请先在上方输入并确认 GitHub Token', 'error');
            return false;
        }
        showStatus(statusEl, '正在保存到 GitHub...', 'saving');
        try {
            const sha = await getFileSHA();
            const content = btoa(unescape(encodeURIComponent(JSON.stringify(newRecords, null, 2))));
            const res = await fetch(API, {
                method: 'PUT',
                headers: {
                    Authorization: `token ${getToken()}`,
                    Accept: 'application/vnd.github+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: `更新班费记录 ${new Date().toLocaleString('zh-CN')}`,
                    content,
                    sha
                })
            });
            if (!res.ok) {
                const err = await res.json();
                throw new Error(err.message || '保存失败');
            }
            records = newRecords;
            records.sort((a, b) => new Date(b.date) - new Date(a.date));
            calculateSummary();
            applyFilters();
            showStatus(statusEl, '保存成功！网站数据已更新', 'success');
            return true;
        } catch (e) {
            showStatus(statusEl, '保存失败：' + e.message, 'error');
            return false;
        }
    }

    function showStatus(el, msg, type) {
        el.textContent = msg;
        el.className = 'save-status ' + type;
    }

    // ── 添加记录 ─────────────────────────────────────────────
    async function addRecord() {
        const date    = document.getElementById('newDate').value;
        const type    = document.getElementById('newType').value;
        const reason  = document.getElementById('newReason').value.trim();
        const amount  = parseFloat(document.getElementById('newAmount').value);
        const handler = document.getElementById('newHandler').value.trim();
        const note    = document.getElementById('newNote').value.trim();

        if (!date || !reason || isNaN(amount) || amount <= 0 || !handler) {
            showStatus(document.getElementById('saveStatus'), '请填写日期、事由、金额（大于0）和经手人', 'error');
            return;
        }

        const newRecord = { date, type, reason, amount, handler, note };
        const newRecords = [...records, newRecord];
        const ok = await pushData(newRecords, document.getElementById('saveStatus'));
        if (ok) clearForm();
    }

    function clearForm() {
        document.getElementById('newReason').value = '';
        document.getElementById('newAmount').value = '';
        document.getElementById('newHandler').value = '';
        document.getElementById('newNote').value = '';
        document.getElementById('newType').value = 'income';
        document.getElementById('newDate').value = new Date().toISOString().slice(0, 10);
    }

    // ── 删除记录 ─────────────────────────────────────────────
    async function deleteRecord(idx) {
        const r = records[idx];
        if (!confirm(`确认删除：${r.date} ${r.reason} ¥${r.amount}？`)) return;
        const newRecords = records.filter((_, i) => i !== idx);
        await pushData(newRecords, document.getElementById('saveStatus'));
    }

    // ── 编辑记录 ─────────────────────────────────────────────
    function openEdit(idx) {
        const r = records[idx];
        document.getElementById('editIndex').value = idx;
        document.getElementById('editDate').value = r.date;
        document.getElementById('editType').value = r.type;
        document.getElementById('editReason').value = r.reason;
        document.getElementById('editAmount').value = r.amount;
        document.getElementById('editHandler').value = r.handler;
        document.getElementById('editNote').value = r.note || '';
        document.getElementById('editStatus').className = 'save-status';
        document.getElementById('editModal').classList.add('visible');
    }

    function closeModal() {
        document.getElementById('editModal').classList.remove('visible');
    }

    async function saveEdit() {
        const idx     = parseInt(document.getElementById('editIndex').value);
        const date    = document.getElementById('editDate').value;
        const type    = document.getElementById('editType').value;
        const reason  = document.getElementById('editReason').value.trim();
        const amount  = parseFloat(document.getElementById('editAmount').value);
        const handler = document.getElementById('editHandler').value.trim();
        const note    = document.getElementById('editNote').value.trim();

        if (!date || !reason || isNaN(amount) || amount <= 0 || !handler) {
            showStatus(document.getElementById('editStatus'), '请填写完整信息', 'error');
            return;
        }

        const newRecords = [...records];
        newRecords[idx] = { date, type, reason, amount, handler, note };
        const ok = await pushData(newRecords, document.getElementById('editStatus'));
        if (ok) setTimeout(closeModal, 1000);
    }

    // ── 数据加载 ─────────────────────────────────────────────
    async function loadData() {
        try {
            const res = await fetch(`https://raw.githubusercontent.com/${OWNER}/${REPO}/main/${FILE}?t=${Date.now()}`);
            if (!res.ok) throw new Error('加载失败');
            records = await res.json();
            records.sort((a, b) => new Date(b.date) - new Date(a.date));
            document.getElementById('loading').style.display = 'none';
            document.getElementById('recordTable').style.display = 'table';
            calculateSummary();
            applyFilters();
            setUpdateTime();
        } catch (e) {
            document.getElementById('loading').innerHTML =
                '<p style="color:#ef4444">❌ 数据加载失败，请检查网络或联系班委</p>';
        }
    }

    // ── 统计 ─────────────────────────────────────────────────
    function calculateSummary() {
        const income  = records.filter(r => r.type === 'income').reduce((s, r) => s + r.amount, 0);
        const expense = records.filter(r => r.type === 'expense').reduce((s, r) => s + r.amount, 0);
        document.getElementById('totalIncome').textContent  = `¥${income.toFixed(2)}`;
        document.getElementById('totalExpense').textContent = `¥${expense.toFixed(2)}`;
        document.getElementById('balance').textContent      = `¥${(income - expense).toFixed(2)}`;
    }

    // ── 渲染表格 ─────────────────────────────────────────────
    function renderTable(data) {
        const tbody     = document.getElementById('recordBody');
        const noResults = document.getElementById('noResults');

        if (data.length === 0) {
            tbody.innerHTML = '';
            noResults.style.display = 'block';
            return;
        }

        noResults.style.display = 'none';
        tbody.innerHTML = data.map((record, i) => {
            const realIdx = records.indexOf(record);
            const displayAmount = record.type === 'income' ? record.amount : -record.amount;
            const actionCell = adminVisible
                ? `<td>
                     <button class="action-btn btn-edit" onclick="openEdit(${realIdx})">编辑</button>
                     <button class="action-btn btn-delete" onclick="deleteRecord(${realIdx})">删除</button>
                   </td>`
                : '';
            return `
                <tr>
                    <td>${record.date}</td>
                    <td><span class="type-badge type-${record.type}">${record.type === 'income' ? '收入' : '支出'}</span></td>
                    <td>${record.reason}</td>
                    <td class="${displayAmount >= 0 ? 'amount-positive' : 'amount-negative'}">
                        ${displayAmount >= 0 ? '+' : ''}¥${Math.abs(displayAmount).toFixed(2)}
                    </td>
                    <td>${record.handler}</td>
                    <td>${record.note || ''}</td>
                    ${actionCell}
                </tr>`;
        }).join('');
    }

    // ── 筛选 ─────────────────────────────────────────────────
    function getFilteredRecords() {
        const searchTerm  = document.getElementById('searchInput').value.toLowerCase();
        const activeFilter = document.querySelector('.filter-btn.active').dataset.filter;
        let filtered = records;
        if (activeFilter !== 'all') filtered = filtered.filter(r => r.type === activeFilter);
        if (searchTerm) filtered = filtered.filter(r =>
            r.reason.toLowerCase().includes(searchTerm) ||
            r.handler.toLowerCase().includes(searchTerm) ||
            (r.note || '').toLowerCase().includes(searchTerm)
        );
        return filtered;
    }

    function applyFilters() { renderTable(getFilteredRecords()); }

    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            applyFilters();
        });
    });

    // 点击遮罩关闭模态框
    document.getElementById('editModal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });

    function setUpdateTime() {
        document.getElementById('updateTime').textContent =
            new Date().toLocaleString('zh-CN', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
    }

    syncThemeButton();
    loadData();
</script>
</body>
</html>
